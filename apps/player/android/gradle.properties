# Heap sized for an 8 GB RAM machine that also runs the Android emulator + IDE.
# -Xmx8G here caused the JVM to over-commit (~12 GB reserved on 8 GB total) and
# the whole build thrashed on swap. 1.5 GB is ample for a Flutter app build.
#
# -Djava.net.preferIPv6Addresses=true: this network has no working IPv4 route,
# only IPv6. Without this the Gradle JVM tries IPv4 first and times out on every
# Maven artifact ("Network is unreachable") before the build can start.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv6Addresses=true
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=2
# Keep the Kotlin compiler daemon small too (separate JVM from Gradle's).
# Do NOT add -Djava.net.preferIPv6Addresses here: it does no downloads and the
# flag breaks its loopback RMI connection to Gradle ("Could not connect to
# Kotlin compile daemon").
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
android.enableJetifier=true
