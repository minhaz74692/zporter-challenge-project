name: challenge
description: "Zporter Challenges — player app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management + DI
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Value equality for entities (no code generation)
  equatable: ^2.0.7

  # Typography — Inter, to match apps/web
  google_fonts: ^6.2.1

  # Render the bundled Figma glyphs in assets/icon/ (challenge stat row, …)
  flutter_svg: ^2.0.10+1

  # Pick a result video from the gallery / camera
  image_picker: ^1.1.2

  # Inline playback of a reported result video (controller review + report tab)
  video_player: ^2.9.2

  # Open a challenge's YouTube media item in the browser / YouTube app
  url_launcher: ^6.3.1

  # Native share sheet (iOS + Android) for the challenge detail screen
  share_plus: ^10.1.4

  # Push notifications (FCM). Firestore/Storage are still API-only; receiving
  # push necessarily needs the messaging SDK on-device.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  youtube_player_iframe: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Generates platform app icons from assets/icon/ — run:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1B1B1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
